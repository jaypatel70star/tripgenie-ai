<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tg-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1d35" />
      <stop offset="100%" stop-color="#040b16" />
    </linearGradient>
    <linearGradient id="tg-ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="tg-plane-gold" x1="18" y1="14" x2="52" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="tg-plane-cyan" x1="14" y1="22" x2="42" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Midnight horizon rounded badge -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#tg-bg)" stroke="url(#tg-ring)" stroke-width="3.2" />

  <!-- Subtle stylized globe meridian + equator -->
  <circle cx="32" cy="32" r="19" stroke="#2dd4bf" stroke-opacity="0.28" stroke-width="1.8" />
  <ellipse cx="32" cy="32" rx="9" ry="19" stroke="#38bdf8" stroke-opacity="0.24" stroke-width="1.5" />
  <path d="M13.5 32H50.5" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Golden & Cyan Travel Jet Emblem -->
  <path d="M49 15L15 29.5L28 35.5L49 15Z" fill="url(#tg-plane-gold)" />
  <path d="M49 15L28 35.5L34 49L49 15Z" fill="url(#tg-plane-cyan)" />
  <path d="M28 35.5L49 15" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" />

  <!-- Glowing travel waypoint dot -->
  <circle cx="17" cy="46" r="3.4" fill="#fbbf24" />
  <circle cx="17" cy="46" r="6" stroke="#fbbf24" stroke-opacity="0.38" stroke-width="1.4" />
</svg>
